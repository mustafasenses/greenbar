<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>greenbar — ASCII README from a GitHub avatar</title>
  <meta name="description"
    content="Type a GitHub username and get an ASCII portrait of the avatar, your profile details beside it, and a README.md ready to paste." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="/octopus.svg" />

  <script type="module" src="/src/main.js"></script>
</head>

<body class="font-body text-ink antialiased">
  <div class="mx-auto max-w-6xl px-4 py-8 sm:py-14">
    <header class="mb-8">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p data-i18n="form" class="font-display text-[11px] uppercase tracking-[0.32em] text-rule"></p>
          <h1 class="font-display text-4xl sm:text-5xl font-bold text-paper mt-2">greenbar</h1>
        </div>
        <div class="flex items-center gap-3 shrink-0">
          <a id="ghRepo" class="flex items-center gap-1.5 text-[11px] text-[#B9C2AE] hover:text-paper transition-colors"
            target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true">
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
            </svg>
            <span data-i18n="source"></span>
          </a>
          <div class="flex gap-1.5" role="group" aria-label="Language">
            <button class="lang" data-lang="en" aria-pressed="true">EN</button>
            <button class="lang" data-lang="tr" aria-pressed="false">TR</button>
          </div>
        </div>
      </div>
      <p data-i18n-html="lede" class="mt-3 max-w-xl text-sm leading-relaxed text-[#B9C2AE]"></p>
    </header>

    <section class="mb-6">
      <div class="flex flex-col sm:flex-row gap-2 max-w-xl">
        <div class="flex items-stretch flex-1 field overflow-hidden">
          <span class="px-3 flex items-center text-ink2 border-r border-rule text-sm select-none">
            github.com/
          </span>
          <input id="username" type="text" autocomplete="off" spellcheck="false" placeholder="octocat"
            class="flex-1 min-w-0 px-3 py-2.5 bg-transparent outline-none text-sm" />
        </div>
        <button id="fetchBtn" data-i18n="print"
          class="px-6 py-2.5 bg-ribbon text-paper font-display text-sm font-bold uppercase tracking-wider rounded-[2px] hover:bg-[#98301f] transition-colors"></button>
      </div>

      <div class="flex items-center gap-3 max-w-xl mt-4">
        <span class="h-px flex-1 bg-[#3C4238]"></span>
        <span data-i18n="or" class="text-[11px] uppercase tracking-[0.2em] text-[#8E9884]"></span>
        <span class="h-px flex-1 bg-[#3C4238]"></span>
      </div>

      <label class="mt-3 flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-3 max-w-xl">
        <span data-i18n="ownPhoto" class="text-sm text-[#B9C2AE] shrink-0"></span>
        <input id="file" type="file" accept="image/*"
          class="flex-1 min-w-0 text-[11px] text-[#8E9884] file:mr-2 file:px-2.5 file:py-1 file:rounded-[2px] file:border-0 file:bg-ink file:text-paper file:cursor-pointer" />
      </label>
    </section>

    <p id="status" class="my-3 text-xs h-4 text-[#B9C2AE]" aria-live="polite"></p>

    <div class="grid lg:grid-cols-[240px_1fr] gap-6 items-start">
      <aside class="bg-paper rounded-[2px] p-5 space-y-5">
        <h2 data-i18n="settings"
          class="font-display text-[11px] uppercase tracking-[0.28em] text-rule border-b border-rule pb-2"></h2>

        <div>
          <span data-i18n="layout" class="text-xs font-medium block mb-2"></span>
          <div class="space-y-1.5" role="group">
            <div class="chip-row">
              <button class="chip" data-opt="layout" data-val="side" data-i18n="lSide" aria-pressed="true"></button>
              <button class="chip" data-opt="layout" data-val="stack" data-i18n="lStack" aria-pressed="false"></button>
            </div>
            <div class="chip-row">
              <button class="chip" data-opt="layout" data-val="ascii" data-i18n="lAscii" aria-pressed="false"></button>
            </div>
          </div>
          <span id="layoutHint" class="block text-[11px] text-ink2 mt-1.5"></span>
        </div>

        <div>
          <span data-i18n="charset" class="text-xs font-medium block mb-2"></span>
          <div class="space-y-1.5" role="group">
            <div class="chip-row">
              <button class="chip" data-opt="style" data-val="classic" data-i18n="sClassic"
                aria-pressed="true"></button>
              <button class="chip" data-opt="style" data-val="detailed" data-i18n="sDetailed"
                aria-pressed="false"></button>
            </div>
            <div class="chip-row">
              <button class="chip" data-opt="style" data-val="letters" data-i18n="sLetters"
                aria-pressed="false"></button>
              <button class="chip" data-opt="style" data-val="digits" data-i18n="sDigits" aria-pressed="false"></button>
              <button class="chip" data-opt="style" data-val="blocks" data-i18n="sBlocks" aria-pressed="false"></button>
            </div>
          </div>
          <span id="styleHint" class="block text-[11px] text-ink2 mt-1.5"></span>
        </div>

        <div>
          <span data-i18n="crop" class="text-xs font-medium block mb-2"></span>
          <div class="chip-row" role="group">
            <button class="chip" data-opt="crop" data-val="auto" data-i18n="cAuto" aria-pressed="true"></button>
            <button class="chip" data-opt="crop" data-val="circle" data-i18n="cCircle" aria-pressed="false"></button>
            <button class="chip" data-opt="crop" data-val="square" data-i18n="cSquare" aria-pressed="false"></button>
          </div>
          <span id="cropHint" class="block text-[11px] text-ink2 mt-1.5"></span>
        </div>

        <label class="block">
          <span class="text-xs font-medium">
            <span data-i18n="size"></span>
            <span id="widthVal" class="text-ribbon">56</span>
          </span>
          <input id="width" type="range" min="24" max="66" value="56" class="mt-2" />
          <span id="widthHint" class="block text-[11px] text-ink2 mt-1"></span>
        </label>

        <label class="block">
          <span class="text-xs font-medium">
            <span data-i18n="contrast"></span>
            <span id="contrastVal" class="text-ribbon">100</span>
          </span>
          <input id="contrast" type="range" min="50" max="200" value="100" class="mt-2" />
          <span data-i18n="contrastHint" class="block text-[11px] text-ink2 mt-1"></span>
        </label>
      </aside>

      <main class="space-y-6">
        <section>
          <div class="flex items-stretch rounded-[2px] overflow-hidden shadow-2xl">
            <div class="sprockets" aria-hidden="true"></div>
            <div class="flex-1 min-w-0 bg-paper">
              <div class="px-4 py-2 border-b border-rule flex items-center justify-between gap-2">
                <span data-i18n="preview" class="font-display text-[10px] uppercase tracking-[0.28em] text-rule"></span>
                <div class="flex gap-2">
                  <button id="copyBtn" data-i18n="copy"
                    class="px-3 py-1.5 bg-ink text-paper text-[11px] font-display uppercase tracking-wider rounded-[2px] hover:bg-[#333a2e] transition-colors"></button>
                  <button id="dlBtn" data-i18n="download"
                    class="px-3 py-1.5 border border-ink text-ink text-[11px] font-display uppercase tracking-wider rounded-[2px] hover:bg-ink hover:text-paper transition-colors"></button>
                </div>
              </div>

              <div id="ghCard" class="gh gh-dark">
                <pre id="ghCode" class="gh-code"></pre>
                <div id="ghFoot" class="gh-md"></div>
              </div>
            </div>
            <div class="sprockets" aria-hidden="true"></div>
          </div>
          <p id="previewNote" class="text-[11px] mt-2 text-[#8E9884]"></p>
        </section>

        <section id="detailsCard" class="bg-paper rounded-[2px] overflow-hidden hidden">
          <div class="flex items-center justify-between px-4 py-2.5 gap-2">
            <button id="detailsToggle" aria-expanded="false" aria-controls="detailsBody"
              class="flex items-center gap-2 flex-1 text-left">
              <svg id="detailsChevron" viewBox="0 0 16 16" width="10" height="10"
                class="shrink-0 transition-transform -rotate-90">
                <path d="M4 2l8 6-8 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              <span data-i18n="details" class="font-display text-[10px] uppercase tracking-[0.28em] text-rule"></span>
            </button>
            <button id="addRow" data-i18n="addRow"
              class="px-3 py-1.5 border border-ink text-ink text-[11px] font-display uppercase tracking-wider rounded-[2px] hover:bg-ink hover:text-paper transition-colors"></button>
          </div>
          <div id="detailsBody" class="px-4 py-3 border-t border-rule hidden">
            <p data-i18n="detailsHint" class="text-[11px] text-ink2 mb-3 leading-relaxed"></p>
            <div id="fieldList" class="space-y-1.5"></div>
          </div>
        </section>

        <p data-i18n="footnote" class="text-[11px] leading-relaxed text-[#8E9884]"></p>
      </main>
    </div>

    <footer
      class="mt-12 pt-4 border-t border-[#3C4238] flex flex-wrap items-center justify-between gap-x-6 gap-y-2 text-[11px] text-[#8E9884]">
      <p>
        <span data-i18n="builtBy"></span>
        <a id="ghProfile" class="footlink" target="_blank" rel="noopener"></a>
      </p>
      <a id="ghRepoFoot" class="footlink" data-i18n="source" target="_blank" rel="noopener"></a>
    </footer>
  </div>
</body>

</html>
